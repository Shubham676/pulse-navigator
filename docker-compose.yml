# Local or single-server setup: Postgres plus the app. Copy .env.example to .env first.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse-local-only}
      POSTGRES_DB: pulse
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "pulse"], interval: 5s, retries: 10 }
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://pulse:${POSTGRES_PASSWORD:-pulse-local-only}@db:5432/pulse
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  pgdata:
